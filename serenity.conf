# Serenity configuration
webdriver {
  driver = chrome
  # Use --headless=new if your Chrome supports it. Fallback to --headless otherwise.
  chrome.switches = "--remote-allow-origins=*,--disable-gpu,--window-size=1366,768"
}

serenity {
  project.name = "Serenity BDD Demoblaze - Testing E2E"
  take.screenshots = FOR_EACH_ACTION
  browser.maximized = true
}

environment {
  base.url = "https://www.demoblaze.com/"
}

# You can override headless mode from CLI:
#   mvn clean verify -Dheadless=true
# Serenity maps -Dheadless to a chrome switch automatically in recent versions,
# but you can also pass: -Dwebdriver.chrome.driver=<path if needed>
